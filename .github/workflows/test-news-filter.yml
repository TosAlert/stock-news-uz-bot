name: Professional News Filter Test

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch to test"
        required: true
        default: "professional-news-filter"
        type: string

permissions:
  contents: read

jobs:
  filter-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test AI filter with sample articles
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
          MIN_IMPACT_SCORE: "7"
        run: python scripts/test_news_filter.py
