name: Stock News UZ

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: stock-news-uz
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run news bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          GEMINI_MODEL: gemini-3.6-flash
          MIN_IMPACT_SCORE: "4"
          NEWS_LOOKBACK_MINUTES: "60"
          MAX_AI_ITEMS_PER_RUN: "15"
          SEC_USER_AGENT: "StockNewsUZ/1.0 contact@example.com"
        run: python -m app.main --once

      - name: Save published-news state
        run: |
          git config user.name "stock-news-uz-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/state.json
          if git diff --cached --quiet; then
            echo "No state changes."
          else
            git commit -m "Update published news state"
            git push
          fi
